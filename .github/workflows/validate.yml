name: Examples Contract CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract-ci:
    name: Validate v1.0 Examples Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Checkout v1.0 schema
        uses: actions/checkout@v4
        with:
          repository: agentoffernetwork/schema
          ref: main
          path: _schema

      - name: Validate v1.0 examples against the published schema
        env:
          AON_SCHEMA_ROOT: _schema/v1.0
        run: npm run test:contract-ci
